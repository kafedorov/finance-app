services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: svod
      POSTGRES_USER: svod
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Create .env with DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U svod -d svod"]
      interval: 10s
      timeout: 5s
      retries: 6
    security_opt: ["no-new-privileges:true"]
  app:
    build: .
    restart: unless-stopped
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://svod:${DB_PASSWORD:?Create .env}@db:5432/svod
      ALLOWED_HOSTS: ${APP_DOMAIN:?Set APP_DOMAIN in .env}
      APP_ORIGIN: https://${APP_DOMAIN:?Set APP_DOMAIN in .env}
    depends_on:
      db:
        condition: service_healthy
    expose: ["8000"]
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    healthcheck:
      test: ["CMD", "python", "-c", "import http.client,os; c=http.client.HTTPConnection('127.0.0.1',8000,timeout=3); c.request('GET','/health',headers={'Host':os.environ['ALLOWED_HOSTS']}); assert c.getresponse().status==200"]
      interval: 30s
      timeout: 5s
      retries: 3
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in .env}
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    security_opt: ["no-new-privileges:true"]
volumes:
  postgres_data:
  caddy_data:
  caddy_config:
